<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            /* Imagem de Fundo (Natureza Profissional) */
            background: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism Atualizado: Mais opaco e mais "embaçado" para melhor leitura */
        .glass-panel {
            background: rgba(40, 40, 40, 0.65); /* Fundo mais escuro */
            backdrop-filter: blur(16px); /* Blur mais forte */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 800px;
            transition: all 0.3s ease;
        }

        h1, h3 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            color: #f8f9fa;
        }

        /* Formulário Público (Sempre Visível) */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
            font-weight: 400;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover { background: #218838; }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
        }
        .btn-danger:hover { background: #c82333; }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(0, 0, 0, 0.5);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Ícone do DBA (Acesso Restrito) */
        .admin-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .admin-icon:hover {
            transform: scale(1.1);
            background: rgba(220, 53, 69, 0.8); /* Fica vermelho ao passar o mouse */
        }

        /* Modal de Login (Para liberar exclusão) */
        #loginModal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .login-box {
            background: rgba(30, 30, 30, 0.9);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            width: 350px;
        }

        .login-box input {
            width: 100%;
            margin-bottom: 15px;
        }
        
        .login-box button {
            width: 100%;
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Modal de Autenticação do DBA -->
    <div id="loginModal">
        <div class="login-box glass-panel">
            <h2>Acesso DBA</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #ccc;">Liberar funções de exclusão</p>
            <input type="text" id="dbaId" placeholder="ID do Administrador">
            <input type="password" id="dbaSenha" placeholder="Senha">
            <button onclick="autenticarDBA()">Autenticar</button>
            <button onclick="fecharLogin()" style="background: transparent; margin-top: 10px; border: 1px solid rgba(255,255,255,0.3);">Cancelar</button>
        </div>
    </div>

    <!-- Painel Principal de Operações -->
    <div class="glass-panel">
        <h1>Gestão de Usuários</h1>
        
        <!-- Cadastro (Aberto a todos) -->
        <form id="formUsuario" class="input-group">
            <input type="text" id="nome" placeholder="Nome completo" required>
            <input type="email" id="email" placeholder="Endereço de e-mail" required>
            <button type="submit" class="btn-success">Adicionar Usuário</button>
        </form>

        <!-- Tabela de Leitura (A coluna de ação só aparece para o DBA) -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <!-- A coluna de ações começa invisível -->
                    <th id="colunaAcoes" style="display: none;">DBA</th> 
                </tr>
            </thead>
            <tbody id="tabelaUsuarios">
                <!-- Javascript insere os dados aqui -->
            </tbody>
        </table>
    </div>

    <!-- Botão Secreto para abrir o Login -->
    <div class="admin-icon" id="btnAdmin" onclick="abrirLogin()" title="Acesso DBA">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>

    <script>
        // Variável de controle de acesso
        let isDbaLogado = false;
        let tokenGlobal = null; // Armazena o crachá digital

        function abrirLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function fecharLogin() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dbaId').value = '';
            document.getElementById('dbaSenha').value = '';
        }

        // Lógica de Autenticação com o Backend
        async function autenticarDBA() {
            const id = document.getElementById('dbaId').value;
            const senha = document.getElementById('dbaSenha').value;

            try {
                // Envia as credenciais para o backend avaliar
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, senha })
                });

                if (resposta.ok) {
                    const dados = await resposta.json();
                    tokenGlobal = dados.token; // Salva o token recebido
                    isDbaLogado = true;
                    fecharLogin();
                    
                    // Libera a coluna de ações na tabela
                    document.getElementById('colunaAcoes').style.display = 'table-cell';
                    
                    // Oculta o botão de login, pois já está autenticado
                    document.getElementById('btnAdmin').style.display = 'none'; 
                    
                    carregarUsuarios(); // Recarrega para desenhar os botões
                    alert("Autenticação validada pelo Servidor. Token Recebido.");
                } else {
                    alert("O Servidor recusou as credenciais.");
                }
            } catch(e) {
                alert("Erro ao conectar com o servidor.");
            }
        }

        // Leitura de Dados (GET)
        async function carregarUsuarios() {
            try {
                const resposta = await fetch('/usuarios');
                const usuarios = await resposta.json();
                
                const tabela = document.getElementById('tabelaUsuarios');
                tabela.innerHTML = '';

                usuarios.forEach(usuario => {
                    const linha = document.createElement('tr');
                    
                    // Condição crucial: O botão de deletar SÓ existe se isDbaLogado for true
                    const botaoAcao = isDbaLogado 
                        ? `<td><button class="btn-danger" onclick="deletarUsuario(${usuario.id})">Deletar</button></td>` 
                        : ``;

                    linha.innerHTML = `
                        <td>${usuario.id}</td>
                        <td>${usuario.nome}</td>
                        <td>${usuario.email}</td>
                        ${botaoAcao}
                    `;
                    tabela.appendChild(linha);
                });
            } catch (erro) {
                console.error("Erro ao carregar dados do servidor.");
            }
        }

        // Inserção de Dados (POST) - Qualquer um pode usar
        document.getElementById('formUsuario').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;

            try {
                const resposta = await fetch('/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email })
                });

                if (resposta.ok) {
                    document.getElementById('nome').value = '';
                    document.getElementById('email').value = '';
                    carregarUsuarios();
                    alert("Usuário adicionado com sucesso!");
                } else {
                    alert("Falha no cadastro. O banco de dados recusou a operação (email duplicado?).");
                }
            } catch (erro) {
                alert("Servidor indisponível.");
            }
        });

        // Deleção de Dados (DELETE) - Protegido pelo Token
        async function deletarUsuario(id) {
            if (!isDbaLogado || !tokenGlobal) {
                alert("Você não tem permissão para isso.");
                return;
            }

            if (confirm(`Atenção DBA: Confirmar exclusão permanente do ID ${id}?`)) {
                try {
                    const resposta = await fetch(`/usuarios/${id}`, { 
                        method: 'DELETE',
                        // Aqui está a mágica: enviamos o Token no Cabeçalho HTTP
                        headers: {
                            'Authorization': `Bearer ${tokenGlobal}`
                        }
                    });
                    
                    if(resposta.ok) {
                        carregarUsuarios();
                    } else {
                        alert("O servidor bloqueou a exclusão. Token inválido.");
                    }
                } catch (erro) {
                    alert("Erro ao executar DELETE.");
                }
            }
        }

        // Carrega a tabela assim que o usuário entra no site
        carregarUsuarios();
    </script>
</body>
</html>
